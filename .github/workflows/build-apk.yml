name: Build APK

on:
  push:
    branches: ["3.0.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          else
            keytool -genkeypair -v -keystore android/release.keystore -alias grid0 -keyalg RSA -keysize 2048 -validity 10000 -storepass grid0pass -keypass grid0pass -dname "CN=GRID0, O=GRID0, C=CA"
          fi
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'grid0pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'grid0' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'grid0pass' }}
        run: gradle assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk"
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: android/release.keystore
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v3.0.0-${{ github.run_number }}" "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk" --title "v3.0.0-${{ github.run_number }}" --notes "Auto build from 3.0.0" || gh release upload "v3.0.0-${{ github.run_number }}" "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk" --clobber
