name: Build APK

on:
  push:
    branches: ["3.0.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v3.0.0-${{ github.run_number }}" "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk" --title "v3.0.0-${{ github.run_number }}" --notes "Auto build from 3.0.0" || gh release upload "v3.0.0-${{ github.run_number }}" "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk" --clobber
