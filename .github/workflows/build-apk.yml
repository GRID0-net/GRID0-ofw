name: Build APK

on:
  push:
    branches: ["3.0.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/GRID0 ofw v3.0.0.apk"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v3.0.0-${{ github.run_number }}" "android/app/build/outputs/apk/debug/GRID0 ofw v3.0.0.apk" --title "v3.0.0-${{ github.run_number }}" --notes "Auto build from 3.0.0" || gh release upload "v3.0.0-${{ github.run_number }}" "android/app/build/outputs/apk/debug/GRID0 ofw v3.0.0.apk" --clobber
