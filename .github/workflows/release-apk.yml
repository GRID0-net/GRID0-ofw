name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload the APK to"
        required: true

jobs:
  release-apk:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          else
            keytool -genkeypair -v -keystore android/release.keystore -alias grid0 -keyalg RSA -keysize 2048 -validity 10000 -storepass grid0pass -keypass grid0pass -dname "CN=GRID0, O=GRID0, C=CA"
          fi
      - name: Inject game key
        env:
          GAME_KEY_HEX: ${{ secrets.GAME_KEY_HEX }}
        run: |
          if [ -n "$GAME_KEY_HEX" ]; then
            mkdir -p android/app/src/main/assets
            printf %s "$GAME_KEY_HEX" > android/app/src/main/assets/game_key.txt
          else
            echo "GAME_KEY_HEX secret not set, building without a game key"
          fi
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'grid0pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'grid0' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'grid0pass' }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -1)
          "$APKSIGNER" sign --ks android/release.keystore --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" --out "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          cp "android/app/build/outputs/apk/release/GRID0 ofw v3.0.0.apk" "GRID0.ofw.v${VERSION}.apk"
          gh release upload "$TAG" "GRID0.ofw.v${VERSION}.apk" --clobber --repo "$GITHUB_REPOSITORY"
